<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickQR — Generator</title>
<style>
:root{--paper:#eef0f7;--ink:#10142b;--mut:#5b617f;--cobalt:#2f45ff;--soft:#dde1f3;--white:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:800;font-size:21px;letter-spacing:-.03em;text-decoration:none;color:inherit}
nav a.back{color:var(--mut);text-decoration:none;font-weight:600;font-size:15px}
h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.04em;line-height:1.05;margin:6px 0 28px}
.app{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start;padding-bottom:70px}
.panel{background:var(--white);border-radius:22px;padding:26px;box-shadow:0 30px 60px -40px rgba(16,20,43,.45)}
.tabs{display:inline-flex;background:var(--paper);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:9px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid transparent;border-radius:12px;padding:12px 14px}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--cobalt);background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opts{margin-top:26px;padding-top:6px;border-top:1px solid var(--soft)}
input[type=range]{width:100%;accent-color:var(--cobalt)}
input[type=color]{width:100%;height:46px;border:0;border-radius:12px;background:var(--paper);padding:5px;cursor:pointer}
output{color:var(--mut);font-weight:600}
.view{position:sticky;top:18px;text-align:center}
.stage{background:var(--paper);border-radius:16px;padding:14px}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:8px;background:#fff}
#meta{margin:14px 0;color:var(--mut);font-size:14px;min-height:21px}
#meta.err{color:#c4182c;font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{font:inherit;font-weight:700;border-radius:12px;padding:13px;border:2px solid var(--ink);background:none;color:var(--ink);cursor:pointer;transition:transform .12s}
.btns button:hover:not(:disabled){transform:translateY(-2px)}
.btns .pri{grid-column:1/3;background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btns button:disabled{opacity:.35;cursor:not-allowed}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none}
@media(max-width:860px){.app{grid-template-columns:1fr}.view{position:static}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="logo" href="index.html">QuickQR</a><a class="back" href="index.html">Back to home</a></nav>
  <h1>Create your QR code</h1>
  <div class="app">
    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="on" data-m="text" role="tab">Link or text</button>
        <button data-m="wifi" role="tab">Wi-Fi</button>
      </div>
      <div id="p-text">
        <label for="txt">What should the code open?</label>
        <textarea id="txt" placeholder="Paste a link or type a message">https://example.com</textarea>
      </div>
      <div id="p-wifi" class="hide">
        <label for="ssid">Network name</label><input type="text" id="ssid" autocomplete="off">
        <div class="row">
          <div><label for="pw">Password</label><input type="text" id="pw" autocomplete="off"></div>
          <div><label for="sec">Security</label><select id="sec"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">None</option></select></div>
        </div>
      </div>
      <div class="opts">
        <div class="row">
          <div><label for="sty">Dot style</label><select id="sty"><option value="sq">Square</option><option value="rd">Rounded</option><option value="dt">Dots</option></select></div>
          <div><label for="ecl">Error correction</label><select id="ecl"><option value="0">Low (7%)</option><option value="1" selected>Medium (15%)</option><option value="2">Quartile (25%)</option><option value="3">High (30%)</option></select></div>
          <div><label for="fg">Code color</label><input type="color" id="fg" value="#10142b"></div>
          <div><label for="bg">Background</label><input type="color" id="bg" value="#ffffff"></div>
          <div><label for="size">Size: <output id="so">512</output> px</label><input type="range" id="size" min="256" max="1024" step="64" value="512"></div>
          <div><label for="mar">Margin: <output id="mo">4</output> modules</label><input type="range" id="mar" min="0" max="8" value="4"></div>
        </div>
      </div>
    </section>
    <aside class="panel view">
      <div class="stage"><canvas id="cv" width="512" height="512" aria-label="Generated QR code"></canvas></div>
      <p id="meta" aria-live="polite"></p>
      <div class="btns">
        <button class="pri" id="png">Download PNG</button>
        <button id="svg">Download SVG</button>
        <button id="cp">Copy image</button>
      </div>
    </aside>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
/* ---------- QR encoder (byte mode, versions 1-40, ECC L/M/Q/H) ---------- */
const ECC=[[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
[13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]];
const BLK=[[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
[1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
[1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
const FMT=[1,0,3,2];
const MASKS=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
const gmul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const a=Math.floor(v/7)+2;r-=(25*a-10)*a-55;if(v>=7)r-=36}return r}
const dataCw=(v,e)=>Math.floor(rawMods(v)/8)-ECC[e][v-1]*BLK[e][v-1];

function penalty(m,n){
  let p=0,dark=0;
  const pats=['10111010000','00001011101'];
  for(let i=0;i<n;i++){
    for(const l of [m[i],m.map(r=>r[i])]){
      let run=1;
      for(let k=1;k<=n;k++){if(k<n&&l[k]==l[k-1])run++;else{if(run>=5)p+=run-2;run=1}}
      const s=l.join('');
      for(const t of pats){let k=-1;while((k=s.indexOf(t,k+1))>=0)p+=40}
    }
    for(let j=0;j<n;j++){
      dark+=m[i][j];
      if(i<n-1&&j<n-1&&m[i][j]==m[i][j+1]&&m[i][j]==m[i+1][j]&&m[i][j]==m[i+1][j+1])p+=3;
    }
  }
  return p+(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;
}

function makeQR(text,e){
  const bytes=new TextEncoder().encode(text);
  let v=1;
  for(;;v++){
    if(v>40)throw new Error('Too much text for one QR code. Shorten it or lower the error correction.');
    if(4+(v<10?8:16)+bytes.length*8<=dataCw(v,e)*8)break;
  }
  const cap=dataCw(v,e)*8,bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];
  for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));

  // Reed-Solomon error correction, split into blocks and interleaved
  const nb=BLK[e][v-1],el=ECC[e][v-1],raw=Math.floor(rawMods(v)/8),ns=nb-raw%nb,sl=Math.floor(raw/nb);
  const div=Array(el).fill(0);div[el-1]=1;
  for(let i=0,root=1;i<el;i++){for(let j=0;j<el;j++){div[j]=gmul(div[j],root);if(j+1<el)div[j]^=div[j+1]}root=gmul(root,2)}
  const blocks=[];
  for(let i=0,k=0;i<nb;i++){
    const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;
    const r=Array(el).fill(0);
    for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,j)=>r[j]^=gmul(c,f))}
    if(i<ns)d.push(0);
    blocks.push(d.concat(r));
  }
  const cw=[];
  for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-el||j>=ns)cw.push(b[i])});

  // Matrix with function patterns
  const n=v*4+17,m=Array.from({length:n},()=>Array(n).fill(0)),fn=Array.from({length:n},()=>Array(n).fill(false));
  const set=(x,y,d)=>{if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=d?1:0;fn[y][x]=true}};
  for(let i=0;i<n;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!=2&&d!=4)}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const na=v>1?Math.floor(v/7)+2:0,step=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2,pos=v>1?[6]:[];
  for(let p=n-7;pos.length<na;p-=step)pos.splice(1,0,p);
  pos.forEach((a,i)=>pos.forEach((b,j)=>{
    if(!((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0)))
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1);
  }));
  const fmt=mk=>{
    const d=(FMT[e]<<3)|mk;let r=d;
    for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
    const b=((d<<10)|r)^0x5412,g=i=>(b>>>i)&1;
    for(let i=0;i<=5;i++)set(8,i,g(i));
    set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));
    for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(n-1-i,8,g(i));
    for(let i=8;i<15;i++)set(8,n-15+i,g(i));
    set(8,n-8,1);
  };
  fmt(0);
  if(v>=7){
    let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);
    const b=(v<<12)|r;
    for(let i=0;i<18;i++){const a=n-11+i%3,c=Math.floor(i/3),bit=(b>>>i)&1;set(a,c,bit);set(c,a,bit)}
  }
  // Place data bits in the zigzag order
  let k=0;
  for(let r=n-1;r>=1;r-=2){
    if(r==6)r=5;
    for(let vt=0;vt<n;vt++)for(let j=0;j<2;j++){
      const x=r-j,y=((r+1)&2)==0?n-1-vt:vt;
      if(!fn[y][x]&&k<cw.length*8){m[y][x]=(cw[k>>>3]>>>(7-(k&7)))&1;k++}
    }
  }
  // Try all 8 masks, keep the one with the lowest penalty
  const mask=t=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&MASKS[t](x,y))m[y][x]^=1};
  let best=0,bp=Infinity;
  for(let t=0;t<8;t++){mask(t);fmt(t);const p=penalty(m,n);if(p<bp){bp=p;best=t}mask(t)}
  mask(best);fmt(best);
  return{m,n,v};
}

/* ---------- App ---------- */
const $=s=>document.querySelector(s);
let mode='text',cur=null;

function payload(){
  if(mode=='text')return $('#txt').value.trim();
  const ssid=$('#ssid').value,t=$('#sec').value,esc=s=>s.replace(/([\\;,:"])/g,'\\$1');
  if(!ssid)return'';
  return`WIFI:T:${t};S:${esc(ssid)};${t=='nopass'?'':'P:'+esc($('#pw').value)+';'};`;
}

function draw(){
  const cv=$('#cv'),px=+$('#size').value,x=cv.getContext('2d');
  cv.width=cv.height=px;
  x.fillStyle=$('#bg').value;x.fillRect(0,0,px,px);
  if(!cur)return;
  const{m,n}=cur,q=+$('#mar').value,s=px/(n+2*q),st=$('#sty').value;
  x.fillStyle=$('#fg').value;
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    if(!m[j][i])continue;
    const X=(i+q)*s,Y=(j+q)*s;
    if(st=='dt'){x.beginPath();x.arc(X+s/2,Y+s/2,s*.46,0,7);x.fill()}
    else if(st=='rd'){x.beginPath();x.roundRect?x.roundRect(X,Y,s,s,s*.32):x.rect(X,Y,s,s);x.fill()}
    else x.fillRect(X,Y,s+.6,s+.6);
  }
}

function toSVG(){
  const{m,n}=cur,q=+$('#mar').value,t=n+2*q,st=$('#sty').value,sz=$('#size').value;
  let d='';
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    if(!m[j][i])continue;
    const X=i+q,Y=j+q;
    d+=st=='dt'?`<circle cx="${X+.5}" cy="${Y+.5}" r=".46"/>`:`<rect x="${X}" y="${Y}" width="1" height="1"${st=='rd'?' rx=".32"':''}/>`;
  }
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" width="${sz}" height="${sz}"><rect width="${t}" height="${t}" fill="${$('#bg').value}"/><g fill="${$('#fg').value}"${st=='sq'?' shape-rendering="crispEdges"':''}>${d}</g></svg>`;
}

function render(){
  $('#so').textContent=$('#size').value;$('#mo').textContent=$('#mar').value;
  const t=payload(),meta=$('#meta');
  meta.className='';
  try{
    cur=t?makeQR(t,+$('#ecl').value):null;
    meta.textContent=cur?`Version ${cur.v}, ${cur.n} × ${cur.n} modules`:'Add some content to see your code.';
  }catch(err){cur=null;meta.className='err';meta.textContent=err.message}
  draw();
  ['png','svg','cp'].forEach(id=>$('#'+id).disabled=!cur);
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

$('#png').onclick=()=>$('#cv').toBlob(b=>{save(b,'quickqr.png');toast('PNG downloaded')});
$('#svg').onclick=()=>{save(new Blob([toSVG()],{type:'image/svg+xml'}),'quickqr.svg');toast('SVG downloaded')};
$('#cp').onclick=()=>$('#cv').toBlob(async b=>{
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Image copied')}
  catch(e){toast('Copy not supported here. Use Download PNG.')}
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));
  $('#p-text').classList.toggle('hide',mode!='text');
  $('#p-wifi').classList.toggle('hide',mode!='wifi');
  render();
});
document.querySelectorAll('textarea,input,select').forEach(el=>el.addEventListener('input',render));
render();
</script>
</body>
</html>
